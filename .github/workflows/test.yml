name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/install.ps1'), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Out-String | Write-Error; exit 1 }
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test installer against isolated mock installation
        shell: powershell
        run: .\tests\installer.ps1
